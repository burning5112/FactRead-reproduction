[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "factread-reproduction"
version = "0.1.0"
description = "Code for the main FactRead experiments"
requires-python = ">=3.10"
dependencies = [
  "torch==2.9.0",
  "transformers==4.46.0",
  "tokenizers==0.20.3",
  "accelerate==1.8.1",
  "numpy==2.2.6",
  "safetensors==0.5.3",
  "huggingface-hub==0.36.0",
]

[project.scripts]
factread-evaluate = "factread.evaluation:main"
factread-tables = "factread.aggregate:main"
factread-prepare = "factread.prepare:main"

[tool.setuptools.packages.find]
where = ["src"]
